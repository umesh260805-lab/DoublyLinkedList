<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doubly Linked List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Doubly Linked List</h1>

    <input type="number" id="valueInput" placeholder="Enter value">

    <button id="insertBeginBtn">Insert at Beginning</button>
    <button id="insertEndBtn">Insert at End</button>
    <button id="deleteFromBeginningBtn">Delete from Beginning</button>
    <button id="deleteFromEndBtn">Delete from End</button>
    <button id="searchBtn">Search</button>

    <div id="listDisplay"></div>
    
    <script src="script.js"></script>

</body>
</html>
